{% extends 'base.html' %}{% block title %}训练记录 · 健身动作助手{% endblock %}{% block page %}records{% endblock %}
{% block head %}<script type="module" src="{{ url_for('static',filename='records.js') }}"></script>{% endblock %}
{% block content %}<div class="container records-page"><div class="heading-with-action"><div class="page-heading"><h1>训练记录</h1><p>回顾已保存的训练摘要</p></div><a class="button" href="/realtime" data-action="history.new" data-nav>开始新分析</a></div>
<nav class="local-tabs" aria-label="记录视图"><a href="/records" data-nav>训练概览</a><a class="active" href="/records?view=list" aria-current="page">记录列表</a></nav><form id="record-filters" class="record-filters" role="search"><label>动作<select id="record-action" name="action_id" data-action="history.filter"><option value="">全部动作</option>{% for action in actions %}<option value="{{ action.action_id }}">{{ action.name }}</option>{% endfor %}</select></label><label>来源<select id="record-source" name="source" data-action="history.filter"><option value="">全部来源</option><option value="camera">摄像头</option><option value="video">上传视频</option></select></label><label>时间<select id="record-period" name="period" data-action="history.filter"><option value="30">最近 30 天</option><option value="7">最近 7 天</option><option value="all">全部时间</option></select></label><label class="record-search"><span class="sr-only">搜索动作名称</span><input id="record-search" name="search" type="search" maxlength="64" placeholder="搜索动作名称" data-action="history.search"></label><button type="button" id="record-clear" class="text-link">清空筛选</button></form>
<p id="records-return-message" class="notice" role="status" hidden></p><div id="records-error" class="notice error" role="alert" hidden></div><button id="records-retry" type="button" class="button secondary small" hidden>重新加载</button>
<section class="account-table-panel"><div class="table-scroll"><table id="records-table" class="records-table" tabindex="-1" aria-label="个人训练记录"><thead><tr><th scope="col"><input type="checkbox" id="record-select-page" aria-label="选择当前页可删除记录" data-action="history.select"></th><th scope="col">动作与时间</th><th scope="col">来源</th><th scope="col">完成量</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="record-rows"><tr><td colspan="6" class="table-empty">正在读取记录…</td></tr></tbody></table></div><div class="table-footer"><div class="record-batch"><span id="record-selection">已选 0 条</span><button id="records-ai-review" type="button" class="button secondary small">AI复盘</button><button id="records-compare" type="button" class="button secondary small" disabled>对比所选两条</button><button id="records-export" type="button" class="button secondary small">训练报告</button><button id="record-delete-selected" type="button" class="danger-link" data-action="history.delete" disabled>删除所选</button><span id="record-total">—</span></div><div class="pagination"><button id="record-prev" type="button" class="button secondary small" aria-label="上一页" data-action="history.page" disabled>←</button><span id="record-page-label">—</span><button id="record-next" type="button" class="button secondary small" aria-label="下一页" data-action="history.page" disabled>→</button></div></div></section></div>{% endblock %}
