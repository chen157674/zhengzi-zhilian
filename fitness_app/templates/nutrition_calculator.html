<dialog id="nutrition-calculator-dialog" class="calculator-dialog" aria-labelledby="calculator-title">
<header class="calculator-header"><div><img src="{{ asset_base }}/icons/hugeicons/ChartHistogramIcon.svg" alt="" width="23" height="23"><h2 id="calculator-title">每日摄入参考</h2></div><button id="calculator-close" class="knowledge-dialog-close" type="button" aria-label="关闭摄入计算"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>关闭</button></header>
<div class="calculator-body"><p id="diet-error" class="notice error" role="alert" hidden></p><div class="nutrition-calculator-layout"><section class="workspace-card" id="diet-reference" tabindex="-1"><div class="section-row"><span class="calculator-section-label">按你的情况估算</span><div class="diet-profile-tools"><button type="button" class="button secondary small" id="diet-use-training">采用健身档案</button><button type="button" class="text-link" id="diet-use-saved" hidden>采用已存资料</button></div></div><p id="diet-profile-state" class="field-help"></p><form id="diet-form" autocomplete="off"><fieldset class="diet-fieldset"><legend>身体信息</legend><div class="settings-fields"><label class="field">年龄<input name="age_years" type="number" min="1" max="120" inputmode="numeric" placeholder="25"></label><label class="field">计算类别<select name="formula_sex"><option value="">请选择</option><option value="male">男</option><option value="female">女</option></select></label><label class="field">身高<span class="calculator-unit-field"><input name="height" type="number" min="1" step="any" inputmode="decimal" placeholder="175"><select name="height_unit" aria-label="身高单位"><option value="cm">cm</option><option value="m">m</option></select></span></label><label class="field">体重<span class="calculator-unit-field"><input name="weight" type="number" min="0.1" step="any" inputmode="decimal" placeholder="70"><select name="weight_unit" aria-label="体重单位"><option value="kg">kg</option><option value="jin">斤</option><option value="lb">lb</option></select></span></label></div></fieldset><fieldset class="diet-fieldset"><legend>日常活动与目标</legend><div class="settings-fields"><label class="field">运动情况<select name="exercise_status"><option value="">请选择</option><option value="regular" selected>规律运动</option><option value="none">目前不规律运动</option><option value="unknown"></option></select></label><label class="field">日常活动<select name="activity_category"><option value="">请选择</option><option value="light">久坐或轻活动</option><option value="moderate" selected>通勤走动较多</option><option value="vigorous">长期高度活跃</option></select></label><label class="field">目标<select name="goal"><option value="general">一般参考</option><option value="maintenance" selected>维持体重</option><option value="muscle_gain">增肌</option></select></label><label class="field">适用情况<select name="special_context"><option value="unknown">请选择</option><option value="none_declared" selected>一般成年人</option><option value="not_applicable">未成年、孕哺期或需专业管理</option></select></label></div></fieldset><label class="knowledge-use-profile"><input type="checkbox" id="diet-remember"> 记住本次资料，下次不用重填</label><div class="button-row"><button id="diet-estimate" class="button" type="submit">看参考</button><button id="diet-clear" type="button" class="button ghost">清空重置</button><button id="diet-delete" class="button ghost small" type="button" hidden>清除已存资料</button></div></form><section id="diet-profile-check" class="notice" hidden><h3>当前保存的资料</h3><div id="diet-profile-check-fields"></div><button id="diet-profile-check-adopt" type="button" class="button secondary small">采用当前资料</button><button id="diet-profile-check-keep" type="button" class="button ghost small">继续编辑本次输入</button></section><p id="diet-status" class="field-help" role="status"></p><section class="diet-output" id="diet-output" hidden><div class="workspace-section-title"><img class="workspace-icon" src="{{ asset_base }}/icons/hugeicons/ChartHistogramIcon.svg" alt="" width="24" height="24"><div><h2>每日摄入</h2></div></div><div id="diet-results" class="diet-results"></div></section></section></div></div>
</dialog>
