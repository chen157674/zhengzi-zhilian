{% extends 'base.html' %}{% block title %}AI服务设置 · 观动知姿{% endblock %}{% block page %}ai-settings{% endblock %}{% block head %}<script type="module" src="/static/ai_settings.js"></script>{% endblock %}
{% block content %}<div class="design-container settings-page"><a class="back-link" href="/settings" data-nav><svg aria-hidden="true"><use href="#arrow-left"/></svg>返回设置</a><div class="page-heading"><h1>AI服务设置</h1></div>
<p id="ai-settings-error" class="notice error" role="alert" hidden></p><button id="ai-settings-retry" class="button secondary" hidden>重新加载</button>
<div class="settings-columns"><section class="settings-card"><h2>我的AI助理</h2><p id="ai-settings-state" class="field-help" role="status">正在读取配置…</p>
<form id="ai-settings-form"><fieldset disabled id="ai-settings-fields"><div class="field"><label for="ai-source">调用来源</label><select id="ai-source"><option value="system">系统限额体验</option><option value="personal">个人DeepSeek密钥</option></select><p id="ai-quota" class="field-help"></p></div>
<div class="field"><label for="ai-model">解读方式</label><select id="ai-model"></select></div><div class="field"><label for="ai-personal-key">个人API密钥</label><input id="ai-personal-key" type="password" autocomplete="off" spellcheck="false" maxlength="1024" placeholder="留空保留已保存的密钥"><p id="ai-key-mask" class="field-help">密钥仅在服务端加密保存。</p></div>
<label class="settings-check"><input id="ai-history" type="checkbox">允许结合本人的相关训练历史</label><div class="button-row"><button class="button" id="ai-settings-save">保存设置</button><button class="button secondary" id="ai-settings-test" type="button">测试连接</button></div><button class="button ghost" id="ai-key-delete" type="button">删除个人密钥</button></fieldset></form></section>
</div>
{% if identity.role=='admin' %}<section class="settings-card admin-ai-policy"><h2>系统体验额度</h2><p id="ai-policy-state" role="status"></p><form id="ai-policy-form"><fieldset id="ai-policy-fields" disabled><div class="settings-fields"><div class="field"><label for="ai-system-key">项目DeepSeek密钥</label><input id="ai-system-key" type="password" autocomplete="off" maxlength="1024" placeholder="留空保留原值"></div><div class="field"><label for="ai-budget">总预算（元）</label><input id="ai-budget" type="number" min="0" max="1000000" step="0.01" required></div><div class="field"><label for="ai-daily">每人每日调用上限</label><input id="ai-daily" type="number" min="0" max="10000" step="1" required></div><div class="field"><label for="ai-output-limit">单次输出Token上限</label><input id="ai-output-limit" type="number" min="128" max="8192" step="1" required></div></div><label class="settings-check"><input id="ai-enabled" type="checkbox">开启系统限额体验</label><button class="button" id="ai-policy-save">保存系统额度</button></fieldset></form></section>{% endif %}</div>{% endblock %}
