{% extends 'base.html' %}{% block title %}登录管理 · 知练同行{% endblock %}{% block page %}account-sessions{% endblock %}
{% block head %}<script type="module" src="/static/account_sessions.js"></script>{% endblock %}
{% block content %}<div class="design-container"><a class="back-link" href="/settings" data-nav><svg aria-hidden="true"><use href="#arrow-left"/></svg>返回设置</a><div class="page-heading inline-heading"><div><h1>登录管理</h1><p>查看当前有效登录，管理其他登录状态。</p></div><button class="button secondary" id="revoke-others" disabled>退出其他登录</button></div><p class="notice error" id="sessions-error" role="alert" hidden></p><button class="button secondary" id="sessions-retry" hidden>重新加载</button><section class="session-list-panel" aria-label="有效登录"><div class="table-scroll"><table class="data-table"><thead><tr><th>登录时间</th><th>有效至</th><th>状态</th></tr></thead><tbody id="sessions-list"><tr><td colspan="3">正在读取…</td></tr></tbody></table></div><p class="session-list-help">退出其他登录需要验证当前密码，不影响本次登录。</p></section></div>
<dialog id="revoke-dialog" aria-labelledby="revoke-title"><h2 id="revoke-title">退出其他登录</h2><p>其他登录将失效，本次登录保留。</p><form id="revoke-form"><div class="field"><label for="revoke-password">当前密码</label><input id="revoke-password" type="password" autocomplete="current-password" maxlength="128" required></div><p id="revoke-error" class="field-error" role="alert"></p><div class="button-row"><button type="button" class="button secondary" id="revoke-cancel">取消</button><button class="button" id="revoke-submit">确认退出</button></div></form></dialog>{% endblock %}
