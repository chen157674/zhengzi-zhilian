<section id="training-note-panel" role="tabpanel" aria-labelledby="record-tab-note" tabindex="0" hidden><p class="record-resource-help">记录本次使用的负重与主观感受，方便下次回顾。所有字段均可不填。</p><form id="training-note-form" data-session-id="{{ session_id }}"><p id="training-info-error" class="notice error" role="alert" hidden></p><fieldset id="training-note-fields" disabled><div class="settings-fields"><div class="field"><label for="note-load">负重或配重档位</label><input id="note-load" type="number" min="0" max="1000000" step="0.01" placeholder="可不填"></div><div class="field"><label for="note-unit">单位</label><select id="note-unit"><option value="kg">公斤 kg</option><option value="lb">磅 lb</option><option value="plate_index">配重档位</option></select></div><div class="field"><label for="note-basis">重量口径</label><select id="note-basis"><option value="total">总重量</option><option value="per_hand">每只手</option><option value="per_side">每一侧</option><option value="device_setting">器械配重档位</option><option value="unspecified">未明确口径</option></select></div><div class="field"><label for="note-difficulty">本次主观感受</label><select id="note-difficulty"><option value="">暂不填写</option><option value="easy">轻松</option><option value="moderate">适中</option><option value="hard">吃力</option></select></div></div><div class="field"><label for="note-text">训练备注</label><textarea id="note-text" rows="3" maxlength="500" placeholder="比如：使用哪台器械、这次想关注什么"></textarea></div><div class="button-row"><button class="button">保存备注</button><button type="button" class="button secondary" id="training-note-cancel">取消修改</button></div></fieldset><button type="button" class="button secondary" id="training-note-retry" hidden>重新加载</button></form></section>
