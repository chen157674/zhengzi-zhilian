<dialog id="knowledge-ai-dialog" class="knowledge-dialog" aria-labelledby="knowledge-dialog-title">
<header class="knowledge-dialog-header"><div class="knowledge-dialog-heading"><img src="{{ asset_base }}/icons/hugeicons/AiMagicIcon.svg" alt="" width="24" height="24"><h2 id="knowledge-dialog-title">AI 教练</h2><span id="knowledge-topic" hidden></span></div><div class="knowledge-dialog-tools"><button id="knowledge-clear" class="knowledge-dialog-close" type="button" aria-label="新对话">新对话</button><button id="knowledge-dialog-close" class="knowledge-dialog-close" type="button" aria-label="关闭AI问答"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>关闭</span></button></div></header>
{% if request.path.startswith('/coach/nutrition') %}<div class="approved-tabs nutrition-mode-tabs" id="nutrition-mode-tabs" role="tablist" aria-label="营养师咨询模式"><button type="button" role="tab" data-nutrition-mode="plan" aria-selected="true">问怎么吃</button><button type="button" role="tab" data-nutrition-mode="analysis" aria-selected="false">分析已吃</button></div>{% endif %}
<div class="knowledge-dialog-body">
<div id="knowledge-chat-welcome" class="knowledge-chat-welcome"><img src="{{ asset_base }}/icons/hugeicons/AiMagicIcon.svg" alt="" width="36" height="36"><h3>今天想练好哪个动作？</h3><div id="knowledge-examples" class="knowledge-examples"></div></div>
<div id="knowledge-messages" class="knowledge-messages" role="log" aria-label="与AI教练的对话" aria-relevant="additions"></div>
<section id="knowledge-reading" hidden><article id="knowledge-answer"><h2 id="knowledge-answer-title" class="sr-only">教练建议</h2><div id="knowledge-result"></div><div id="knowledge-sources" hidden></div></article></section>
</div>
<div class="knowledge-composer"><div id="analysis-input-heading" class="analysis-input-heading" hidden><span class="analysis-section-label">我的饮食</span><h3>把吃过的食物写下来</h3><p>写上食物和分量，也可以补充口味、忌口和训练时间。</p></div><div id="nutrition-analysis-choice" class="nutrition-analysis-choice" hidden><span>分析范围</span><div role="group" aria-label="饮食分析范围"><button type="button" data-analysis-kind="meal" aria-pressed="true">这一餐</button><button type="button" data-analysis-kind="day" aria-pressed="false">今天饮食</button></div></div><p id="knowledge-profile-context" class="knowledge-profile-context" role="status" hidden></p><p id="knowledge-error" class="notice error" role="alert" hidden></p><div class="button-row"><button id="knowledge-retry" class="button secondary small" type="button" hidden>重试</button><a id="knowledge-settings" class="button secondary small" href="/account/ai" data-nav hidden>设置 AI 服务</a></div>
<form id="knowledge-clarification" hidden><label class="field"><span id="knowledge-question"></span><input id="knowledge-answer-input" maxlength="500" required></label><button class="button small" type="submit">回答</button></form>
{% if request.path.startswith('/coach/nutrition') %}<label class="knowledge-use-profile"><input type="checkbox" id="knowledge-use-profile"> 本次采用我的资料与饮食偏好</label>{% endif %}
<form id="knowledge-form" class="knowledge-dialog-form"><label class="sr-only" for="knowledge-query">向AI教练提问</label><textarea id="knowledge-query" maxlength="1000" rows="2" placeholder="问动作细节，或继续追问…" required></textarea><div class="knowledge-compose-actions"><span id="knowledge-state" role="status"></span><button class="button" id="knowledge-stop" type="button" hidden>停止回答</button><button class="button" id="knowledge-search" type="submit">发送<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form>
<div id="knowledge-run" hidden><button id="knowledge-generate" type="button" hidden>重新回答</button><button id="knowledge-copy" type="button" hidden>复制回答</button><button id="knowledge-followup" type="button" hidden>继续问</button></div>
</div></dialog>
