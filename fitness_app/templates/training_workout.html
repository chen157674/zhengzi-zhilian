{% extends 'base.html' %}{% block title %}训练执行 · 我的训练{% endblock %}{% block page %}training-workout{% endblock %}{% block head %}<script type="module" src="/static/workout_execution.js"></script>{% endblock %}{% block content %}<div class="design-container" id="workout-page" data-workout-id="{{ workout_id }}">{% include 'training_nav.html' %}<a class="back-link" href="/training/plan" data-nav>返回训练计划</a><div class="heading-with-action"><div class="page-heading"><h1 id="workout-title">正在读取本次训练</h1><p id="workout-state"></p><p id="workout-elapsed" class="field-help"></p></div><button type="button" class="button ghost" data-ai-open>问AI教练</button></div><p id="workout-error" class="notice error" role="alert" hidden></p><button id="workout-retry" class="button secondary" hidden>核对并重新读取</button><p id="workout-version-note" class="field-help" role="status" hidden></p><div id="workout-layout" class="workout-layout"><aside id="workout-items" class="knowledge-answer"></aside><article class="knowledge-answer"><h2 id="workout-action"></h2><p id="workout-target"></p><div id="workout-commands" class="button-row"></div><form id="workout-set-form" autocomplete="off" hidden><label class="field">记录第几组<select id="workout-set-index"></select></label><label class="field"><span id="workout-actual-label">实际次数</span><input id="workout-actual" type="number" min="1" max="600" required></label><details class="workout-load-options"><summary>记录负重（选填）</summary><div class="settings-fields"><label class="field">负重（可选）<input id="workout-load" type="number" min="0" max="500" step="0.01"></label><label class="field">单位<select id="workout-load-unit"><option value="kg">公斤</option><option value="lb">磅</option></select></label><label class="field">口径<select id="workout-load-basis"><option value="per_hand">每只手</option><option value="per_side">每侧</option><option value="total">总重量</option><option value="device_setting">器械设置</option><option value="unspecified">未说明</option></select></label></div></details><div class="button-row"><button id="workout-save-set" class="button" type="submit">记录这一组</button><button id="workout-skip-set" class="button secondary" type="button">跳过本组</button></div></form><p id="workout-rest" class="field-help" role="status"></p><button id="workout-rest-skip" type="button" class="text-link" hidden>跳过休息</button><div id="workout-sets"></div><div id="workout-item-actions" class="button-row"></div><section id="workout-candidates" hidden><div class="section-row"><h3>采用分析记录</h3><button id="workout-candidate-cancel" type="button" class="button ghost small">取消选择</button></div><p>只采用你确认的周期或保持区间，不自动平均分组。</p><form id="workout-candidate-filter" class="settings-fields" autocomplete="off"><label class="field">搜索记录<input id="workout-candidate-query" type="search" maxlength="64" placeholder="动作名称"></label><label class="field">开始日期<input id="workout-candidate-from" type="date"></label><label class="field">结束日期<input id="workout-candidate-to" type="date"></label><div class="button-row"><button class="button secondary small" type="submit">筛选记录</button><button id="workout-candidate-clear" class="button ghost small" type="button">清空筛选</button></div></form><p id="workout-candidate-status" class="field-help" role="status"></p><div id="workout-candidate-list"></div><div class="button-row"><button id="workout-candidate-prev" class="button secondary small" type="button" hidden>上一页记录</button><button id="workout-candidate-next" class="button secondary small" type="button" hidden>下一页记录</button></div></section><div id="workout-links"></div><hr><div id="workout-finish" class="button-row"></div></article></div><section id="workout-summary" class="knowledge-answer" hidden></section></div>{% endblock %}
