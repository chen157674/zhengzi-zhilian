<aside id="ai-assistant" class="ai-assistant" aria-labelledby="ai-assistant-title" hidden>
<header class="ai-assistant-header"><h2 id="ai-assistant-title">AI动作助理</h2><div class="ai-assistant-header-actions"><button id="ai-chat-new" class="button ghost" type="button" aria-label="新建对话" title="新建对话">＋</button><button id="ai-assistant-close" class="button ghost" type="button" aria-label="收起AI助理" title="收起">✕</button></div></header>
<div class="ai-assistant-content"><button id="ai-assistant-refresh" class="button secondary small" type="button" hidden>更新训练摘要</button><div id="ai-chat-welcome" class="ai-chat-welcome"><h3>看懂提示，练得更稳。</h3><p>聊聊动作调整，找到下一组的关注重点。</p><div class="ai-prompt-list"><button type="button" class="button secondary" data-ai-prompt="当前姿态提示应该怎样调整？">当前提示怎么调整</button><button type="button" class="button secondary" data-ai-prompt="结合我的训练记录，下一次应该优先关注什么？">下次优先关注什么</button></div></div><div id="ai-chat-messages" class="ai-chat-messages" role="log" aria-label="与AI的对话" aria-relevant="additions"></div><p id="ai-chat-error" class="notice error" role="alert" hidden></p></div>
<form id="ai-chat-form" class="ai-chat-form"><div class="ai-chat-attachments"><label class="settings-check"><input type="checkbox" id="ai-send-consent" checked>训练摘要</label><label class="settings-check" id="ai-send-frame-label" hidden title="勾选后，发送问题时会将近期画面提交给 DeepSeek"><input type="checkbox" id="ai-send-frame" aria-describedby="ai-frame-hint">当前画面</label></div><p id="ai-frame-hint" class="field-help" hidden>发送时将画面附给 DeepSeek</p><label class="sr-only" for="ai-chat-input">向AI询问动作或训练问题，Enter发送，Shift加Enter换行</label><textarea id="ai-chat-input" maxlength="4000" rows="2" placeholder="问问动作或训练问题…" title="Enter发送，Shift+Enter换行"></textarea><div class="ai-chat-actions"><span id="ai-request-state" class="field-help" role="status"></span><button id="ai-chat-stop" type="button" class="button secondary" hidden>停止</button><button id="ai-chat-send" type="submit" class="button" disabled>发送</button></div></form></aside>
