<aside id="ai-assistant" class="ai-assistant{% if ai_page_mode|default(false) %} ai-page-panel{% endif %}" data-mode="{{ 'page' if ai_page_mode|default(false) else 'panel' }}" aria-labelledby="ai-assistant-title"{% if not ai_page_mode|default(false) %} hidden{% endif %}>
<header class="ai-assistant-header"><h2 id="ai-assistant-title">AI教练</h2><div class="ai-assistant-header-actions"><button id="ai-chat-new" class="button ghost" type="button" aria-label="新建对话" title="新建对话">＋</button><button id="ai-assistant-close" class="button ghost" type="button" aria-label="收起AI教练" title="收起"{% if ai_page_mode|default(false) %} hidden{% endif %}>✕</button></div></header>
<div class="ai-assistant-content"><button id="ai-assistant-refresh" class="button secondary small" type="button" hidden>更新训练摘要</button><div id="ai-chat-welcome" class="ai-chat-welcome">{% if ai_page_mode|default(false) %}<span class="coach-welcome-symbol"><img src="{{ asset_base }}/icons/hugeicons/Dumbbell01Icon.svg" alt="" width="28" height="28"></span><h3>今天想问什么？</h3><p>从一个具体问题开始，聊聊你的下一步训练。</p><div class="ai-prompt-list">
<button type="button" class="button secondary" data-ai-prompt="深蹲时找不到发力感觉，应该先检查什么？"><img src="{{ asset_base }}/icons/hugeicons/Dumbbell01Icon.svg" alt="" width="22" height="22"><span class="coach-prompt-copy"><strong>动作细节</strong><small>姿势、发力和动作节奏</small></span><span class="coach-prompt-arrow" aria-hidden="true">↗</span></button>
<button type="button" class="button secondary" data-ai-prompt="我是健身新手，每周能练3次，每次30分钟，应该怎么安排？"><img src="{{ asset_base }}/icons/hugeicons/Calendar03Icon.svg" alt="" width="22" height="22"><span class="coach-prompt-copy"><strong>训练安排</strong><small>按基础和可用时间来安排</small></span><span class="coach-prompt-arrow" aria-hidden="true">↗</span></button>
<button type="button" class="button secondary" data-ai-prompt="{{ '请结合我选择的训练记录，说明下一次应优先调整什么。' if selected_context else '我想复盘一次训练，应该记录哪些信息，才能找到下一次需要调整的重点？' }}"><img src="{{ asset_base }}/icons/hugeicons/File01Icon.svg" alt="" width="22" height="22"><span class="coach-prompt-copy"><strong>记录复盘</strong><small>{{ '选择上方记录，具体看看反馈' if record_options else '了解该记录哪些训练信息' }}</small></span><span class="coach-prompt-arrow" aria-hidden="true">↗</span></button>
</div>{% else %}<h3>看懂提示，练得更稳。</h3><p>聊动作、训练，也可以问其他问题。</p><div class="ai-prompt-list"><button type="button" class="button secondary" data-ai-prompt="结合我的健身档案，应该怎样安排训练？">根据我的档案怎么练</button><button type="button" class="button secondary" data-ai-prompt="结合我的训练记录，下一次应该优先关注什么？">下次优先关注什么</button></div>{% endif %}</div><details id="nutrition-panel" class="nutrition-panel"><summary>AI教练 · 动作与饮食</summary>

<div class="nutrition-tabs" role="group" aria-label="估算输入方式"><button type="button" class="button secondary small" id="nutrition-tab-description" aria-pressed="true">描述情况</button><button type="button" class="button ghost small" id="nutrition-tab-form" aria-pressed="false">填写信息</button></div>
<div id="nutrition-description"><label for="nutrition-description-text">你的情况</label><textarea id="nutrition-description-text" maxlength="2000" rows="3" autocomplete="off" placeholder="例如：这个动作先改什么？或描述年龄、体重与饮食目标。"></textarea><div class="ai-inline-toggles"><label class="settings-check nutrition-context"><input id="nutrition-cloud-consent" type="checkbox" checked>附带当前描述与训练摘要</label><label class="settings-check nutrition-context"><input id="coach-history-consent" type="checkbox" checked>参考近30天同类训练</label></div><div class="button-row"><button type="button" class="button small" id="nutrition-description-send">开始分析</button><button type="button" class="button ghost small" id="nutrition-description-stop" hidden>停止</button></div><div id="nutrition-coach-answer"></div></div>
<form id="nutrition-form" autocomplete="off" hidden>
<div class="nutrition-fields">
<label>年龄<input name="age_years" inputmode="numeric" type="number" min="1" max="120" placeholder="岁"></label>
<label>体重<div class="nutrition-weight"><input name="weight" inputmode="decimal" type="number" min="0.1" max="1000" step="any" placeholder="当前体重"><select name="weight_unit" aria-label="体重单位"><option value="kg">公斤</option><option value="jin">市斤</option><option value="lb">磅</option></select></div></label>
<label>运动情况<select name="exercise_status"><option value="">请选择</option><option value="regular">规律运动</option><option value="none">目前不规律运动</option></select></label>
<label>热量公式类别<select name="formula_sex"><option value="">暂不提供</option><option value="male">男</option><option value="female">女</option></select></label>
<label class="nutrition-wide">整体日常活动<select name="activity_category"><option value="">请选择</option><option value="light">久坐或轻活动</option><option value="moderate">活跃或中等活动</option><option value="vigorous">长期高度活跃</option></select></label>
</div><label class="settings-check nutrition-context"><input type="checkbox" name="not_applicable">未成年、孕哺期或需专业饮食管理</label>
<div class="button-row"><button type="submit" class="button small">估算参考范围</button><button id="nutrition-clear" type="button" class="button ghost small">清除</button></div>
</form><p id="nutrition-status" class="field-help" role="status"></p><div id="nutrition-results" aria-label="本次摄入参考结果"></div>
<div class="nutrition-profile-actions"><button type="button" class="text-link" id="nutrition-use-profile">使用已保存资料</button><button type="button" class="text-link" id="nutrition-save-profile">保存本次资料</button><button type="button" class="text-link" id="nutrition-delete-profile">删除已保存资料</button></div></details><div id="ai-chat-messages" class="ai-chat-messages" role="log" aria-label="与AI的对话" aria-relevant="additions"></div><p id="ai-chat-error" class="notice error" role="alert" hidden></p></div>
<form id="ai-chat-form" class="ai-chat-form">{% if ai_page_mode|default(false) %}<div class="coach-composer-heading"><span>说说你的问题</span><small>Enter 发送 · Shift+Enter 换行</small></div>{% endif %}<div class="ai-chat-attachments"><label class="settings-check"><input type="checkbox" id="ai-send-consent" checked>训练摘要</label><label class="settings-check" id="ai-send-frame-label" hidden title="勾选后，发送问题时会将近期画面提交给 DeepSeek"><input type="checkbox" id="ai-send-frame" aria-describedby="ai-frame-hint"><span id="ai-frame-label">当前画面</span></label></div><p id="ai-frame-hint" class="field-help" hidden>发送时将画面附给 DeepSeek</p><label class="sr-only" for="ai-chat-input">向AI提问，Enter发送，Shift加Enter换行</label><textarea id="ai-chat-input" maxlength="4000" rows="2" placeholder="{{ '例如：每周能练3次，怎么安排力量训练？' if ai_page_mode|default(false) else '有什么想问的，直接聊…' }}" title="Enter发送，Shift+Enter换行"></textarea><div class="ai-chat-actions"><span id="ai-request-state" class="field-help" role="status"></span>{% if ai_page_mode|default(false) %}<button id="coach-nutrition-entry" type="button" class="button ghost small">饮食参考</button>{% endif %}<button id="ai-chat-stop" type="button" class="button secondary" hidden>停止</button><button id="ai-chat-send" type="submit" class="button" disabled>发送</button></div></form></aside>
