{% extends 'base.html' %}{% block title %}实时分析 · 观动知姿{% endblock %}{% block page %}realtime{% endblock %}{% block head %}<script type="module" src="/static/live.js"></script>{% endblock %}
{% block content %}<div class="live-shell" id="live-workspace"><p id="live-error" class="notice error" role="alert" hidden></p><section id="live-save-banner" class="notice error" hidden><strong>本次结果尚未全部保存</strong><p>分析已冻结，请先处理未保存的内容。</p><button class="button" id="live-save-retry">重试保存</button><button class="button secondary" id="live-save-discard">保留已保存内容</button></section>
<div class="live-toolbar"><strong id="live-action">自动识别 · 等待开始</strong><label class="live-action-select"><span class="sr-only">识别方式或手动指定动作</span><select id="live-selection"><option value="" disabled selected>手动指定动作</option><option value="">自动识别（默认）</option>{% for a in actions %}<option value="{{ a.action_id }}" data-capability="{{ a.capability_version }}">{{ a.name }}</option>{% endfor %}</select></label><div class="live-view-tools"><label><input id="live-skeleton" type="checkbox" checked>显示骨架</label><label><input id="live-mirror" type="checkbox" checked>镜像画面</label></div><div class="live-buttons"><button class="button secondary ai-entry" data-ai-open type="button">AI助理</button><button class="button" id="live-toggle">开启摄像头</button><button class="button secondary" id="live-finish" hidden>结束训练</button></div></div>
<div class="live-stage" id="live-stage"><video id="live-source" playsinline muted hidden></video><canvas id="live-canvas" aria-label="同帧摄像头画面与姿态骨架" hidden></canvas><div class="live-empty" id="live-empty"><svg><use href="#camera"/></svg><h1>准备开始训练</h1><p>开启摄像头，开始这一组。</p></div><button class="live-fullscreen" id="live-fullscreen" disabled>全屏</button><span class="live-paused" id="live-paused" hidden>已暂停</span><aside class="live-cue" id="live-cue" hidden><button id="live-cue-collapse" class="cue-collapse" aria-expanded="true">收起提示</button><strong id="live-cue-title"></strong><p id="live-cue-text"></p><button id="live-retest-start" class="button secondary small" type="button" hidden>验证这项调整</button></aside></div>
<section id="live-retest-panel" class="detail-panel" hidden></section><div class="live-foot"><div class="live-foot-tools"><button class="button secondary mobile-camera-flip" id="live-camera-flip" type="button">切换后置相机</button></div><p id="live-status" role="status"></p><p id="live-skeleton-save-state" class="field-help" role="status"></p><p id="live-stability-save-state" class="field-help" role="status"></p><details class="live-framing-guide" id="live-framing-guide"><summary id="live-guide-summary">取景建议</summary><div><ol id="live-guide-steps"></ol><div id="live-guide-items"></div></div></details><details id="live-settings" class="workspace-settings"><summary>设备与训练设置</summary><div class="settings-grid"><label class="setting-toggle"><span><strong>保存骨架回放</strong><small>保留 30 天</small></span><input type="checkbox" id="live-save-skeleton"></label><label class="setting-field"><span>摄像头</span><select id="live-device"><option value="">默认摄像头</option></select></label><label class="setting-field"><span>拍摄机位</span><select id="live-view"><option value="auto">自动</option><option value="front">正面</option><option value="side">侧面</option><option value="oblique">斜侧面</option></select></label></div><div class="settings-footer"><a href="/actions" data-nav>设置分组训练</a></div></details></div>
<section id="live-summary" hidden><div class="page-heading"><h1>本次训练结果</h1><p id="live-summary-message"></p></div><div id="live-summary-records"></div><div class="button-row"><button class="button" id="live-again">再练一次</button><a class="button secondary" href="/records" data-nav>查看训练记录</a></div></section></div>{% endblock %}
