<dialog id="report-export-dialog" class="report-export-dialog" aria-labelledby="report-export-title">
<div class="report-export-heading"><button type="button" class="button ghost small" id="report-export-back">← 返回</button><h2 id="report-export-title">训练报告</h2></div>
<p class="field-help">导出为 PDF，下载链接保留 24 小时。</p>
<p id="report-export-error" class="notice error" role="alert" hidden></p>
<section id="report-export-options" hidden><p id="report-export-scope"></p><ul id="report-export-sources" class="field-help"></ul><label class="settings-check"><input type="checkbox" id="report-export-notes">附上负重与训练备注</label><p id="report-export-ai-empty" class="field-help" hidden>暂无可附加的 AI 复盘。</p><fieldset class="report-export-ai" id="report-export-ai-fieldset"><legend>可选AI复盘</legend><div id="report-export-ai-list"></div></fieldset><button type="button" class="button" id="report-export-generate">生成PDF</button></section>
<p id="report-export-status" class="field-help" role="status"></p>
<section id="report-export-result" class="report-export-result" hidden><h3>本次报告</h3><p id="report-export-result-info"></p><p id="report-export-result-warning" class="notice" hidden></p><div class="button-row"><button type="button" class="button" id="report-export-download" hidden>下载PDF</button><button type="button" class="button secondary" id="report-export-reselect">重新选择记录</button><button type="button" class="button ghost" id="report-export-delete">删除报告</button></div><div id="report-export-delete-confirm" class="notice" hidden><p>只删除这份报告，训练记录保留。</p><div class="button-row"><button type="button" class="button secondary" id="report-export-delete-cancel">取消</button><button type="button" class="button" id="report-export-delete-yes">确认删除报告</button></div></div></section>
<section class="report-export-history"><h3>最近生成</h3><div id="report-export-history"></div></section>
</dialog>
