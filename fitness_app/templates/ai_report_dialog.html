<dialog id="ai-report-dialog" class="report-export-dialog ai-report-dialog" aria-labelledby="ai-report-title">
<div class="report-export-heading"><h2 id="ai-report-title">训练复盘</h2><button type="button" class="button ghost small" id="ai-report-back" aria-label="关闭训练复盘"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div class="ai-report-layout"><div class="ai-report-main">
<p id="ai-report-error" class="notice error" role="alert" hidden></p>
<section id="ai-report-options" hidden><div class="ai-report-range" id="ai-report-range"><span class="section-kicker">本次训练</span><p id="ai-report-count" class="ai-report-count"></p><p id="ai-report-scope"></p><p id="ai-report-range-label" class="ai-report-range-label" hidden></p></div>
<div class="ai-report-empty" id="ai-report-empty" hidden><svg viewBox="0 0 48 40" aria-hidden="true"><use href="#camera"/></svg><h3>还没有可复盘的训练</h3><p>完成一次训练，或调整筛选范围。</p><a class="button" href="/realtime" data-nav>去训练</a></div>
<label class="settings-check ai-report-history-toggle" id="ai-report-history-toggle"><span>参考相关训练历史</span><input type="checkbox" id="ai-report-history-reference"></label>
<section class="ai-report-basis" id="ai-report-basis"><h3>本次训练</h3><ul id="ai-report-sources" class="ai-report-sources"></ul><p id="ai-report-read-scope" class="field-help"></p><div id="ai-report-observations"></div></section>
<div class="ai-report-submit" id="ai-report-submit"><p id="ai-report-provider" class="field-help"></p><label class="settings-check"><input type="checkbox" id="ai-report-consent" checked><span>基于本次训练摘要生成AI复盘</span></label>
<div class="button-row"><button type="button" class="button" id="ai-report-generate">生成AI复盘</button><button type="button" class="button secondary" id="ai-report-refresh">更新范围</button></div></div></section>
<p id="ai-report-state" class="field-help" role="status"></p>
<section id="ai-report-pending" class="notice" hidden><p>请先查看上次生成进度。</p><div class="button-row"><button type="button" class="button secondary" id="ai-report-check">查看生成进度</button><button type="button" class="button secondary" id="ai-report-resend" hidden>重试生成</button></div></section>
<section id="ai-report-result" class="report-export-result" hidden><h3 id="ai-report-result-title">已保存复盘</h3><div id="ai-report-answer"></div><div class="button-row"><button type="button" class="button secondary" id="ai-report-stop" hidden>停止生成</button><button type="button" class="text-link" id="ai-report-copy" hidden>复制</button><button type="button" class="button secondary" id="ai-report-regenerate" hidden>重新生成</button><button type="button" class="button ghost" id="ai-report-new">返回选择</button><button type="button" class="button ghost" id="ai-report-delete" hidden>删除复盘正文</button></div>
<div id="ai-report-delete-confirm" class="notice" hidden><p>删除这份复盘？训练记录会保留。</p><div class="button-row"><button type="button" class="button secondary" id="ai-report-delete-no">取消</button><button type="button" class="button" id="ai-report-delete-yes">确认删除正文</button></div></div></section>
</div><details class="report-export-history"><summary>复盘历史</summary><div class="section-row"><h3 class="sr-only">复盘历史</h3><button type="button" class="button ghost small" id="ai-report-history-refresh">刷新</button></div><div id="ai-report-history" aria-live="polite"></div><div class="button-row" id="ai-report-pagination" hidden><button type="button" class="button secondary small" id="ai-report-prev" disabled aria-label="上一页">←</button><span id="ai-report-page" class="field-help"></span><button type="button" class="button secondary small" id="ai-report-next" disabled aria-label="下一页">→</button></div></details></div>
</dialog>
