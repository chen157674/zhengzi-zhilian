{% extends 'base.html' %}
{% block title %}纠错标注 · 观动知姿{% endblock %}
{% block page %}correction-labels{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/correction_labels.css"><script type="module" src="/static/correction_labels.js"></script>{% endblock %}
{% block content %}
<div class="design-container correction-label-page">
 <a class="back-link" href="/settings" data-nav>返回设置</a>
 <div class="page-heading"><h1>一起标注动作问题</h1><p>选一小段视频，指出你看见的问题。拿不准就选“看不清”。</p></div>
 <p id="label-error" role="alert" hidden></p>
 <section class="settings-card"><div class="field"><label for="label-demo">选择视频</label><select id="label-demo" disabled></select></div>
 <video id="label-video" controls playsinline preload="metadata"></video>
 <div class="button-row"><button type="button" class="button secondary" id="label-start" disabled>此处开始</button><button type="button" class="button secondary" id="label-end" disabled>此处结束</button><label for="label-speed">播放速度</label><select id="label-speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select></div>
 </section>
 <section class="settings-card"><form id="correction-label-form"><fieldset id="label-fields" disabled>
 <div class="label-grid"><div class="field"><label for="label-from">开始（秒）</label><input id="label-from" type="number" min="0" step="0.001" required></div><div class="field"><label for="label-to">结束（秒）</label><input id="label-to" type="number" min="0.001" step="0.001" required></div>
 <div class="field"><label for="label-code">检查什么问题</label><select id="label-code"></select></div><div class="field"><label for="label-verdict">你看到了什么</label><select id="label-verdict"><option value="unknown">看不清 / 不确定</option><option value="present">确实有这个问题</option><option value="absent">这一项未见问题</option></select></div>
 <div class="field"><label for="label-side">哪一侧（按本人左右）</label><select id="label-side"><option value="unknown">不确定</option><option value="left">本人左侧</option><option value="right">本人右侧</option><option value="both">两侧</option><option value="none">不分左右</option></select></div>
 <div class="field"><label for="label-phase">这段在做什么</label><select id="label-phase"><option value="unknown">不确定</option><option value="work">正在做动作</option><option value="setup">准备 / 调整握持</option><option value="rest">休息 / 结束</option></select></div></div>
 <div class="field"><label for="label-note">补充说明（可选）</label><textarea id="label-note" maxlength="300" rows="2"></textarea></div>
 <div class="button-row"><button class="button" id="label-save">保存这条标注</button><button type="button" class="button secondary" id="label-new">新建一条</button></div>
 <p id="label-state" role="status" aria-live="polite"></p></fieldset></form></section>
 <section class="settings-card"><h2>已保存的标注</h2><ul id="label-list" class="label-list"></ul></section>
</div>{% endblock %}
